<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Scenora - An elegant, cinematic movie discovery experience. Find your next favorite."
		/>
		<meta name="theme-color" content="#0B0D12" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
			rel="stylesheet"
		/>
		<script>
			(function () {
				try {
					var stored =
						localStorage.getItem('scenora-theme') || localStorage.getItem('cineva-theme');
					var theme = stored;
					if (!theme) {
						var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
						theme = prefersLight ? 'light' : 'dark';
					}
					if (theme === 'light') {
						document.documentElement.classList.remove('dark');
						document.documentElement.classList.add('light');
						document.documentElement.setAttribute('data-theme', 'light');
					} else {
						document.documentElement.classList.remove('light');
						document.documentElement.classList.add('dark');
						document.documentElement.setAttribute('data-theme', 'dark');
					}
				} catch (e) {
					document.documentElement.classList.add('dark');
					document.documentElement.setAttribute('data-theme', 'dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-cinema-bg text-cinema-text antialiased selection:bg-cinema-accent selection:text-cinema-accent-foreground"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
